name: Deploy to SSH

on:
  push:
    branches:
      - master
      - main
      - claude/**

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create production .env file
        run: |
          echo "# Database Configuration - Local/Demo (carbontype.co)" > dist/.env
          echo "LOCAL_DB_HOST=localhost" >> dist/.env
          echo "LOCAL_DB_NAME=shine_festivals" >> dist/.env
          echo "LOCAL_DB_USER=shine_user" >> dist/.env
          echo "LOCAL_DB_PASS=${{ secrets.LOCAL_DB_PASS }}" >> dist/.env
          echo "" >> dist/.env
          echo "# Database Configuration - Production (crbntyp.com)" >> dist/.env
          echo "PROD_DB_HOST=localhost" >> dist/.env
          echo "PROD_DB_NAME=shine_festivals" >> dist/.env
          echo "PROD_DB_USER=shine_user" >> dist/.env
          echo "PROD_DB_PASS=${{ secrets.LOCAL_DB_PASS }}" >> dist/.env
          echo "" >> dist/.env
          echo "# Database Charset" >> dist/.env
          echo "DB_CHARSET=utf8mb4" >> dist/.env
          echo "" >> dist/.env
          echo "# Application Settings" >> dist/.env
          echo "APP_ENV=production" >> dist/.env
          echo "APP_TIMEZONE=Europe/London" >> dist/.env
          echo "DEFAULT_VENUE_ID=6" >> dist/.env
          echo "" >> dist/.env
          echo "# Admin Authentication" >> dist/.env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> dist/.env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> dist/.env
          echo "" >> dist/.env
          echo "# Mapbox (3D Map)" >> dist/.env
          echo "MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}" >> dist/.env

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.DS_Store' \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/crbntyp/blsnc/
