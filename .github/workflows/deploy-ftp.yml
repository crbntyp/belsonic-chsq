name: Deploy to SSH

on:
  push:
    branches:
      - master
      - main
      - claude/**

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create production .env file
        run: |
          cat > dist/.env <<EOF
          # Database Configuration - Local/Demo (carbontype.co)
          LOCAL_DB_HOST=localhost
          LOCAL_DB_NAME=shine_festivals
          LOCAL_DB_USER=shine_user
          LOCAL_DB_PASS=${{ secrets.DB_PASSWORD }}

          # Database Configuration - Production (crbntyp.com)
          PROD_DB_HOST=localhost
          PROD_DB_NAME=shine_festivals
          PROD_DB_USER=shine_user
          PROD_DB_PASS=${{ secrets.DB_PASSWORD }}

          # Database Charset
          DB_CHARSET=utf8mb4

          # Application Settings
          APP_ENV=production
          APP_TIMEZONE=Europe/London
          DEFAULT_VENUE_ID=6

          # Admin Authentication
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.DS_Store' \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/crbntyp/blsnc/
